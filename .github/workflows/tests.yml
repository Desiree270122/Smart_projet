# Vérifie à chaque push que toutes les pages de l'application s'exécutent.
# Une croix rouge sur le commit (onglet « Actions » de GitHub) signale une page
# cassée. Streamlit Cloud déploie quand même : corriger avant de pousser
# reste la règle (python -m pytest tests).
name: Tests de l'application

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pytest
      - name: Tests
        run: python -m pytest tests -q
